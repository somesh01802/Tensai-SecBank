# SecBank incident workflow (Kibana 9.5 Workflows). Paste into the Workflows editor.
# Attach it to the three SecBank rules as an action (rule > Actions > Workflow) on BOTH
# "Query matched" and "Recovered".
# New alert: read the problem, open ONE case per problem (tag problem:<id>, so no duplicates).
# Recovery: close that case. It never runs a fix: remediation stays a human decision.
# The "cannot be validated, type unknown" warnings on {{ }} variables are expected (runtime values).

name: SecBank incident from alert
description: One case per SecBank problem, with impact, evidence, owner and recommended response.
enabled: true
tags: [secbank]

triggers:
  - type: alert

steps:
  # 1. The alert id is the problem id (rules group by problem.id). Read the full problem.
  - name: get_problem
    type: elasticsearch.search
    with:
      index: bank-problems
      size: 1
      query:
        term:
          problem.id: "{{ event.alerts[0].kibana.alert.instance.id }}"

  # 2. Already a case for this problem? (dedup)
  - name: find_case
    type: cases.findCases
    with:
      tags: ["problem:{{ event.alerts[0].kibana.alert.instance.id }}"]
      status: open

  # 3. Recovered -> close the case. Otherwise open one if none exists, severity mapped from P1/P2/P3.
  - name: route
    type: if
    condition: "event.alerts[0].kibana.alert.status: recovered"
    steps:
      - name: close_if_open
        type: if
        condition: "steps.find_case.output.total > 0"
        steps:
          - name: close_case
            type: cases.updateCase
            with:
              cases:
                - id: "{{ steps.find_case.output.cases[0].id }}"
                  version: "{{ steps.find_case.output.cases[0].version }}"
                  status: closed
    else:
      - name: open_if_new
        type: if
        condition: "steps.find_case.output.total: 0"
        steps:
          - name: by_severity
            type: if
            condition: "steps.get_problem.output.hits.hits[0]._source.problem.severity: critical"
            steps:
              - name: create_case_p1
                type: cases.createCase
                with:
                  severity: critical
                  owner: observability
                  title: &title "[{{ steps.get_problem.output.hits.hits[0]._source.problem.priority }}] {{ steps.get_problem.output.hits.hits[0]._source.problem.title }}"
                  tags: &tags ["secbank", "problem:{{ event.alerts[0].kibana.alert.instance.id }}", "{{ steps.get_problem.output.hits.hits[0]._source.problem.priority }}"]
                  connector: &connector { id: none, name: none, type: .none, fields: null }
                  settings: &settings { syncAlerts: false }
                  description: &desc |
                    Severity: {{ steps.get_problem.output.hits.hits[0]._source.problem.priority }} ({{ steps.get_problem.output.hits.hits[0]._source.problem.severity }})
                    Problem: {{ steps.get_problem.output.hits.hits[0]._source.problem.id }}
                    Affected service: {{ steps.get_problem.output.hits.hits[0]._source.service.name }}
                    Journey: {{ steps.get_problem.output.hits.hits[0]._source.journey.name }}
                    Started: {{ steps.get_problem.output.hits.hits[0]._source.problem.started_at }}
                    Detected: {{ steps.get_problem.output.hits.hits[0]._source.problem.detected_at }}
                    Impact: {{ steps.get_problem.output.hits.hits[0]._source.impact.customers }} customers, {{ steps.get_problem.output.hits.hits[0]._source.impact.value_at_risk }} USD at risk
                    Owner: {{ steps.get_problem.output.hits.hits[0]._source.problem.owner }}
                    Status: open
                    Recommended response: {{ steps.get_problem.output.hits.hits[0]._source.problem.response }}
                    Evidence: SecBank D7 Incident Room, same time range. Every action is human approved.
            else:
              - name: major_or_minor
                type: if
                condition: "steps.get_problem.output.hits.hits[0]._source.problem.severity: major"
                steps:
                  - name: create_case_p2
                    type: cases.createCase
                    with: { severity: high, owner: observability, title: *title, tags: *tags, connector: *connector, settings: *settings, description: *desc }
                else:
                  - name: create_case_p3
                    type: cases.createCase
                    with: { severity: medium, owner: observability, title: *title, tags: *tags, connector: *connector, settings: *settings, description: *desc }
