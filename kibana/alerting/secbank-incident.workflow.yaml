# SecBank incident workflow (Kibana 9.5 Workflows). Paste into the Workflows editor, replacing the old version.
# Rule action: run on "New alerts" and "Recovered alerts" (untick "Ongoing alerts": one run per problem is enough).
#
# New problem:  claim it in bank-incidents (a second run for the same problem fails here, so no duplicate INC) ->
#               evidence (logs, journey health) -> Agent Builder RCA -> 3 ranked hypotheses ->
#               ServiceNow incident -> Kibana case (with INC number and the top hypothesis) -> bank-incidents doc.
# Recovered:    close the case, mark the incident closed in bank-incidents, add a work note to the INC.
# bank-incidents (not bank-problems): the detector rewrites bank-problems documents every minute.
# The agent proposes; it never acts. "Variable cannot be validated" warnings on {{ }} are expected.

name: SecBank incident from alert
description: One ServiceNow incident, one case and one agent RCA per SecBank problem; closes them on recovery.
enabled: true
tags: [secbank, servicenow, rca]

consts:
  snow_connector: "e1f11ca0-6c2c-11ee-9f22-031e4c4c6b59"
  agent: incident-root-cause-analyzer

triggers:
  - type: alert

steps:
  - name: get_problem
    type: elasticsearch.search
    with:
      index: bank-problems
      size: 1
      query:
        term:
          problem.id: "{{ event.alerts[0].kibana.alert.instance.id }}"

  - name: find_case
    type: cases.findCases
    with:
      tags: ["problem:{{ event.alerts[0].kibana.alert.instance.id }}"]
      status: open

  - name: find_incident
    type: elasticsearch.search
    with:
      index: bank-incidents
      size: 1
      query:
        ids:
          values: ["{{ event.alerts[0].kibana.alert.instance.id }}"]

  - name: route
    type: if
    condition: "event.alerts[0].kibana.alert.status: recovered"
    steps:
      # ================= RECOVERED =================
      - name: close_if_open
        type: if
        condition: "steps.find_case.output.total > 0"
        steps:
          - name: close_case
            type: cases.updateCase
            with:
              case_id: "{{ steps.find_case.output.cases[0].id }}"
              updates:
                status: closed
      - name: incident_if_any
        type: if
        condition: "steps.find_incident.output.hits.total.value > 0"
        steps:
          - name: mark_closed
            type: elasticsearch.request
            with:
              method: POST
              path: "/bank-incidents/_update/{{ event.alerts[0].kibana.alert.instance.id }}"
              body:
                doc:
                  incident: { state: closed }
          - name: snow_note
            type: servicenow
            connector-id: "e1f11ca0-6c2c-11ee-9f22-031e4c4c6b59"
            on-failure:
              continue: true
            with:
              subAction: pushToService
              subActionParams:
                incident:
                  externalId: "{{ steps.find_incident.output.hits.hits[0]._source.snow.sys_id }}"
                  short_description: "SecBank - {{ steps.find_incident.output.hits.hits[0]._source.problem.title }}"
                comments:
                  - commentId: "recovered"
                    comment: "Problem closed by the SecBank detector: no signal for 5 minutes. Please verify and resolve."
    else:
      # ================= NEW PROBLEM =================
      - name: is_new
        type: if
        condition: "steps.find_incident.output.hits.total.value: 0 and steps.get_problem.output.hits.total.value > 0"
        steps:
          # Claim: _create fails (409) if another run already took this problem, so the INC is raised once.
          - name: claim
            type: elasticsearch.request
            with:
              method: PUT
              path: "/bank-incidents/_create/{{ event.alerts[0].kibana.alert.instance.id }}"
              body:
                "@timestamp": "{{ now | date: '%Y-%m-%dT%H:%M:%SZ' }}"
                problem:
                  id: "{{ steps.get_problem.output.hits.hits[0]._source.problem.id }}"
                  priority: "{{ steps.get_problem.output.hits.hits[0]._source.problem.priority }}"
                  severity: "{{ steps.get_problem.output.hits.hits[0]._source.problem.severity }}"
                  title: "{{ steps.get_problem.output.hits.hits[0]._source.problem.title }}"
                incident: { state: opening }
                labels: { data_source: workflow }

          - name: get_log_evidence
            type: elasticsearch.request
            on-failure:
              continue: true
            with:
              method: POST
              path: /logs-bank.app-*/_search
              body:
                size: 0
                query:
                  bool:
                    filter:
                      - range:
                          "@timestamp":
                            gte: "{{ steps.get_problem.output.hits.hits[0]._source.problem.started_at }}"
                      - terms:
                          log.level: [error, ERROR, warn, warning, WARN, fatal, critical]
                aggs:
                  patterns: { terms: { field: bank.log_pattern, size: 5 } }
                  services: { terms: { field: service.name, size: 5 } }

          - name: get_journey_evidence
            type: elasticsearch.request
            on-failure:
              continue: true
            with:
              method: POST
              path: /bank-journey-health/_search
              body:
                size: 0
                query:
                  bool:
                    filter:
                      - term:
                          journey.name: "{{ steps.get_problem.output.hits.hits[0]._source.journey.name }}"
                      - range:
                          "@timestamp":
                            gte: "{{ steps.get_problem.output.hits.hits[0]._source.problem.started_at }}"
                aggs:
                  attempts: { sum: { field: health.attempts } }
                  completed: { sum: { field: health.completed } }
                  tech_failures: { sum: { field: health.tech_failures } }
                  value_failed: { sum: { field: health.value_failed } }
                  min_index: { min: { field: health.index } }

          - name: run_rca
            type: ai.agent
            agent-id: "incident-root-cause-analyzer"
            timeout: "3m"
            on-failure:
              retry:
                max-attempts: 2
                delay: "15s"
              continue: true
            with:
              message: |
                Perform a root cause analysis for this SecBank customer journey problem.

                Problem: {{ steps.get_problem.output.hits.hits[0]._source.problem.title }}
                Problem ID: {{ steps.get_problem.output.hits.hits[0]._source.problem.id }}
                Priority: {{ steps.get_problem.output.hits.hits[0]._source.problem.priority }} ({{ steps.get_problem.output.hits.hits[0]._source.problem.severity }})
                Kind: {{ steps.get_problem.output.hits.hits[0]._source.problem.kind }}
                Journey: {{ steps.get_problem.output.hits.hits[0]._source.journey.name | default: 'N/A' }}
                Service: {{ steps.get_problem.output.hits.hits[0]._source.service.name | default: 'N/A' }}
                Branch / region: {{ steps.get_problem.output.hits.hits[0]._source.bank.branch.id | default: 'N/A' }} / {{ steps.get_problem.output.hits.hits[0]._source.bank.region | default: 'all' }}
                Started: {{ steps.get_problem.output.hits.hits[0]._source.problem.started_at }}, detected: {{ steps.get_problem.output.hits.hits[0]._source.problem.detected_at }}
                Impact: {{ steps.get_problem.output.hits.hits[0]._source.impact.customers }} customers, {{ steps.get_problem.output.hits.hits[0]._source.impact.failures }} failures, value at risk {{ steps.get_problem.output.hits.hits[0]._source.impact.value_at_risk }} USD

                Error and warn log patterns since start (JSON):
                {{ steps.get_log_evidence.output.aggregations | json }}

                Journey health since start (JSON):
                {{ steps.get_journey_evidence.output.aggregations | json }}

                INSTRUCTIONS:
                1. Find which dependency or service is failing and how (latency, errors, timeouts, capacity, silent skip, link down).
                2. Use numbers and times as evidence. Say which signal moved first.
                3. Query logs-bank.*, metrics-bank.platform-*, bank-journey-health and traces-apm* with your tools if needed.
                4. Give exactly 3 ranked hypotheses with confidences that add up to at most 1. Say why the 2nd and 3rd are not the cause.
                5. End the top hypothesis with one line: CAUSE: service / component / fault type

                Answer in plain text (no markdown) with: HYPOTHESES (1-3), EVIDENCE, IMPACT, REMEDIATION STEPS.

          - name: card_fields
            type: ai.prompt
            on-failure:
              continue: true
            with:
              temperature: 0
              prompt: |
                From this root cause analysis, extract the 3 ranked hypotheses for a wallboard card.
                title: under 6 words, e.g. "Payment gateway latency". confidence: 0 to 1.
                detail: one or two sentences with the numbers and times from the analysis.
                cause: only for the top hypothesis, the "CAUSE: service / component / fault type" line.
                next_action: the single remediation action in under 5 words, e.g. "Failover payment_gw".
                Analysis:
                {{ steps.run_rca.output.response.message | default: steps.run_rca.output.message | default: 'No analysis available' }}
              schema:
                type: object
                properties:
                  hypotheses:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        confidence: { type: number }
                        detail: { type: string }
                        cause: { type: string }
                      required: [title, confidence, detail]
                  next_action: { type: string }
                required: [hypotheses, next_action]

          - name: create_incident
            type: servicenow
            connector-id: "e1f11ca0-6c2c-11ee-9f22-031e4c4c6b59"
            on-failure:
              retry:
                max-attempts: 3
                delay: "10s"
                strategy: exponential
              continue: true
            with:
              subAction: pushToService
              subActionParams:
                incident:
                  short_description: >-
                    SecBank - {{ steps.get_problem.output.hits.hits[0]._source.problem.priority }}
                    {{ steps.get_problem.output.hits.hits[0]._source.problem.severity }}: {{ steps.get_problem.output.hits.hits[0]._source.problem.title }}
                  description: |
                    SecBank - {{ steps.get_problem.output.hits.hits[0]._source.problem.title }}

                    Problem Details:
                    - Problem ID: {{ steps.get_problem.output.hits.hits[0]._source.problem.id }}
                    - Priority: {{ steps.get_problem.output.hits.hits[0]._source.problem.priority }} ({{ steps.get_problem.output.hits.hits[0]._source.problem.severity }})
                    - Journey: {{ steps.get_problem.output.hits.hits[0]._source.journey.name | default: 'N/A' }}
                    - Service: {{ steps.get_problem.output.hits.hits[0]._source.service.name | default: 'N/A' }}
                    - Started: {{ steps.get_problem.output.hits.hits[0]._source.problem.started_at }}
                    - Detected: {{ steps.get_problem.output.hits.hits[0]._source.problem.detected_at }}
                    - Customers impacted: {{ steps.get_problem.output.hits.hits[0]._source.impact.customers }}
                    - Value at risk: {{ steps.get_problem.output.hits.hits[0]._source.impact.value_at_risk }} USD
                    - Owner: {{ steps.get_problem.output.hits.hits[0]._source.problem.owner }}
                    - Recommended response: {{ steps.get_problem.output.hits.hits[0]._source.problem.response }}

                    ==================================================
                    AI ROOT CAUSE ANALYSIS (Elastic Agent Builder)
                    ==================================================
                    {{ steps.run_rca.output.response.message | default: steps.run_rca.output.message | default: 'RCA could not be generated. Please investigate manually.' }}

                    Agent: incident-root-cause-analyzer
                    Agent conversation ID: {{ steps.run_rca.output.conversation_id | default: 'N/A' }}
                    Proposed action (needs human approval): {{ steps.card_fields.output.content.next_action | default: 'N/A' }}

                    Incident generated automatically by Elastic Workflow.
                  severity: "{% if steps.get_problem.output.hits.hits[0]._source.problem.priority == 'P1' %}critical{% elsif steps.get_problem.output.hits.hits[0]._source.problem.priority == 'P2' %}major{% else %}warning{% endif %}"
                  impact: "{% if steps.get_problem.output.hits.hits[0]._source.problem.priority == 'P1' %}High{% elsif steps.get_problem.output.hits.hits[0]._source.problem.priority == 'P2' %}Medium{% else %}Low{% endif %}"
                  urgency: "{% if steps.get_problem.output.hits.hits[0]._source.problem.priority == 'P1' %}High{% elsif steps.get_problem.output.hits.hits[0]._source.problem.priority == 'P2' %}Medium{% else %}Low{% endif %}"
                  category: "Inquiry/Help"
                  additional_fields: >-
                    {
                      "u_state": "In-Progress",
                      "u_location": "Chennai",
                      "u_category": "Inquiry/Help",
                      "u_subcategory": "None",
                      "u_business_service": "Alerts  Monitoring",
                      "u_cmdb_ci": "{{ steps.get_problem.output.hits.hits[0]._source.service.name | default: 'secbank' }}",
                      "u_assignment_group": "Automation Group"
                    }
                  correlation_id: "secbank-problem-{{ steps.get_problem.output.hits.hits[0]._source.problem.id }}"
                  correlation_display: "SecBank Problem - {{ steps.get_problem.output.hits.hits[0]._source.problem.title }}"

          - name: case_if_none
            type: if
            condition: "steps.find_case.output.total: 0"
            steps:
              - name: by_severity
                type: if
                condition: "steps.get_problem.output.hits.hits[0]._source.problem.severity: critical"
                steps:
                  - name: create_case_p1
                    type: cases.createCase
                    with:
                      severity: critical
                      owner: observability
                      title: &title "[{{ steps.get_problem.output.hits.hits[0]._source.problem.priority }}] {{ steps.get_problem.output.hits.hits[0]._source.problem.title }} ({{ steps.create_incident.output.title | default: 'no INC' }})"
                      tags: &tags ["secbank", "problem:{{ event.alerts[0].kibana.alert.instance.id }}", "{{ steps.get_problem.output.hits.hits[0]._source.problem.priority }}"]
                      settings: &settings { syncAlerts: false }
                      description: &desc |
                        Severity: {{ steps.get_problem.output.hits.hits[0]._source.problem.priority }} ({{ steps.get_problem.output.hits.hits[0]._source.problem.severity }})
                        ServiceNow: {{ steps.create_incident.output.title | default: 'not created' }} {{ steps.create_incident.output.url }}
                        Problem: {{ steps.get_problem.output.hits.hits[0]._source.problem.id }}
                        Affected service: {{ steps.get_problem.output.hits.hits[0]._source.service.name }}
                        Journey: {{ steps.get_problem.output.hits.hits[0]._source.journey.name }}
                        Started: {{ steps.get_problem.output.hits.hits[0]._source.problem.started_at }}
                        Detected: {{ steps.get_problem.output.hits.hits[0]._source.problem.detected_at }}
                        Impact: {{ steps.get_problem.output.hits.hits[0]._source.impact.customers }} customers, {{ steps.get_problem.output.hits.hits[0]._source.impact.value_at_risk }} USD at risk
                        Owner: {{ steps.get_problem.output.hits.hits[0]._source.problem.owner }}
                        Status: open
                        Top hypothesis: {{ steps.card_fields.output.content.hypotheses[0].title | default: 'RCA not available' }}, confidence {{ steps.card_fields.output.content.hypotheses[0].confidence | default: 0 }}
                        {{ steps.card_fields.output.content.hypotheses[0].cause }}
                        Recommended response: {{ steps.get_problem.output.hits.hits[0]._source.problem.response }}
                        Proposed action (needs human approval): {{ steps.card_fields.output.content.next_action | default: 'N/A' }}
                        Evidence: SecBank D7 Incident Room, same time range. The agent proposes; it does not act.
                else:
                  - name: major_or_minor
                    type: if
                    condition: "steps.get_problem.output.hits.hits[0]._source.problem.severity: major"
                    steps:
                      - name: create_case_p2
                        type: cases.createCase
                        with: { severity: high, owner: observability, title: *title, tags: *tags, settings: *settings, description: *desc }
                    else:
                      - name: create_case_p3
                        type: cases.createCase
                        with: { severity: medium, owner: observability, title: *title, tags: *tags, settings: *settings, description: *desc }

          # The AI hypotheses widget reads this document.
          - name: write_incident
            type: elasticsearch.request
            with:
              method: POST
              path: "/bank-incidents/_update/{{ event.alerts[0].kibana.alert.instance.id }}"
              body:
                doc:
                  incident: { state: open }
                  snow:
                    number: "{{ steps.create_incident.output.title | default: '' }}"
                    sys_id: "{{ steps.create_incident.output.id | default: '' }}"
                    url: "{{ steps.create_incident.output.url | default: '' }}"
                  rca:
                    agent: incident-root-cause-analyzer
                    posted_at: "{{ now | date: '%Y-%m-%dT%H:%M:%SZ' }}"
                    conversation_id: "{{ steps.run_rca.output.conversation_id | default: '' }}"
                    analysis: "{{ steps.run_rca.output.response.message | default: steps.run_rca.output.message | default: 'RCA not available' }}"
                    next_action: "{{ steps.card_fields.output.content.next_action | default: 'Investigating' }}"
                    h1_title: "{{ steps.card_fields.output.content.hypotheses[0].title | default: 'RCA not available' }}"
                    h1_confidence: "{{ steps.card_fields.output.content.hypotheses[0].confidence | default: 0 }}"
                    h1_detail: "{{ steps.card_fields.output.content.hypotheses[0].detail | default: '' }}"
                    h1_cause: "{{ steps.card_fields.output.content.hypotheses[0].cause | default: '' }}"
                    h2_title: "{{ steps.card_fields.output.content.hypotheses[1].title | default: '' }}"
                    h2_confidence: "{{ steps.card_fields.output.content.hypotheses[1].confidence | default: 0 }}"
                    h2_detail: "{{ steps.card_fields.output.content.hypotheses[1].detail | default: '' }}"
                    h3_title: "{{ steps.card_fields.output.content.hypotheses[2].title | default: '' }}"
                    h3_confidence: "{{ steps.card_fields.output.content.hypotheses[2].confidence | default: 0 }}"
                    h3_detail: "{{ steps.card_fields.output.content.hypotheses[2].detail | default: '' }}"
            on-failure:
              retry:
                max-attempts: 3
                delay: "10s"
                strategy: exponential
              continue: false
